[project]
name = "fic-robot"
version = "2.0.0"
description = "Robô do Fulltime Intelligent Consig: fila do Supabase + Selenium no Chrome do backoffice"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "keyring==25.7.0",
  "selenium==4.53.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
