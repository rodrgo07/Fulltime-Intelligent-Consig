[project]
name = "fic-engine"
version = "0.1.0"
description = "Motor RPA do Fulltime Intelligent Consig"
requires-python = ">=3.12,<3.14"
dependencies = [
  "playwright==1.65.1",
  "pydantic==2.14.3",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "pyinstaller==6.22.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fic_rpa"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
