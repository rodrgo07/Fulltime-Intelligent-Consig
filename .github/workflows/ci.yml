name: CI

# Roda em todo push/PR. Cada área só é testada quando seus arquivos mudam.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      js: ${{ steps.f.outputs.js }}
      db: ${{ steps.f.outputs.db }}
      robot: ${{ steps.f.outputs.robot }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          # Mudar o próprio CI roda todas as áreas (senão a correção do workflow não é exercitada).
          filters: |
            # Os testes JS também leem os códigos de erro do SQL, das Edge Functions e do robô.
            js: ['apps/web/**', 'packages/**', 'pnpm-lock.yaml', 'supabase/migrations/**', 'supabase/functions/**',
                 'services/robot/src/**', '.github/workflows/ci.yml']
            db: ['supabase/**', 'services/robot/src/**', 'services/robot/tests/e2e_driver.py', '.github/workflows/ci.yml']
            robot: ['services/robot/**', '.github/workflows/ci.yml']

  frontend:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fic/contracts --filter @fic/web typecheck
      - run: pnpm --filter @fic/contracts --filter @fic/web test
      - run: pnpm --filter @fic/web build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  database:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # tests/robot-e2e.test.ts sobe o robô Python real com o fluxo FALSO de teste.
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install httpx==0.28.1
      # RLS, funções, retenção, robô ponta a ponta e Edge Functions (lógica) em PGlite, sem tocar a nuvem.
      - run: pnpm --filter @fic/supabase test
        env:
          FIC_REQUIRE_E2E: "1"
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      # Roda dentro de supabase/functions para o Deno usar o deno.json local ("nodeModulesDir": "none").
      # Na raiz ele acha package.json + node_modules do pnpm, exige os pacotes npm lá e reescreve o package.json.
      - name: Type-check das Edge Functions
        working-directory: supabase/functions
        run: deno check ./*/index.ts
      - name: O type-check não alterou arquivos versionados
        run: git diff --exit-code

  supabase-compat:
    # Aplica as migrations num Supabase local efêmero (pg_cron, vault, realtime reais).
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    env:
      PORTAL_URL: http://127.0.0.1:5174  # site único (apps/web)
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase db start
        working-directory: .
      - run: supabase db lint --level error
      # pg_cron (3 jobs fic-*), sem pg_net, publicação do Realtime e privilégios dos papéis da API.
      - name: Verificação de compatibilidade
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/compat/verify.sql
      - run: supabase stop --no-backup

  robot:
    needs: changes
    if: needs.changes.outputs.robot == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install ".[dev]"
        working-directory: services/robot
      - run: python -m pytest -q
        working-directory: services/robot
