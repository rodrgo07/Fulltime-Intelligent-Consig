name: Deploy (portal e Supabase)

# Portal: Cloudflare Pages a cada push em main que altere o portal.
# Supabase (migrations + Edge Functions): manual, com aprovação no Environment "production".
on:
  push:
    branches: [main]
    paths: ['apps/portal/**', 'packages/**']
  workflow_dispatch:
    inputs:
      target:
        description: 'O que publicar'
        type: choice
        options: [portal, supabase]
        default: portal

permissions:
  contents: read
  deployments: write

jobs:
  portal:
    if: github.event_name == 'push' || inputs.target == 'portal'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fic/contracts --filter @fic/portal test
      - run: pnpm --filter @fic/portal build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/portal/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main

  supabase:
    if: inputs.target == 'supabase'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PORTAL_URL: ${{ vars.PORTAL_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fic/supabase test
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
      - run: supabase db push
      - run: supabase functions deploy dispatch-notifications admin-invite --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
