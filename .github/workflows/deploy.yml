name: Deploy (site e Supabase)

# O Environment "production" só aceita tags v* e exige aprovação (docs/UPDATE_SYSTEM.md).
# Site: Cloudflare Pages a cada tag vX.Y.Z.
# Supabase (migrations + Edge Functions): manual (Run workflow escolhendo a TAG em "Use workflow from").
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      target:
        description: 'O que publicar (execute a partir de uma tag v*)'
        type: choice
        options: [portal, supabase]
        default: portal

permissions:
  contents: read
  deployments: write

jobs:
  portal:
    if: github.event_name == 'push' || inputs.target == 'portal'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pré-condições (variáveis e secrets do Cloudflare/Supabase)
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          missing=""
          for v in CLOUDFLARE_PAGES_PROJECT SUPABASE_URL SUPABASE_ANON_KEY; do
            [ -n "${!v}" ] || missing="$missing var:$v"
          done
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            h="HAS_$s"; [ "${!h}" = "true" ] || missing="$missing secret:$s"
          done
          [ -z "$missing" ] || { echo "::error::Configuração ausente no Environment production:$missing (PROMPT A9 / docs/SECURITY.md)"; exit 1; }
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fic/contracts --filter @fic/web test
      - run: pnpm --filter @fic/web build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      # wrangler via pnpm dlx (versão fixa): o cloudflare/wrangler-action tenta "pnpm add" na raiz do
      # workspace e falha com ERR_PNPM_ADDING_TO_ROOT.
      - name: Publicar no Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: pnpm dlx wrangler@4.162.0 pages deploy apps/web/dist --project-name="$PROJECT" --branch=main

  supabase:
    if: inputs.target == 'supabase'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      PORTAL_URL: ${{ vars.PORTAL_URL }}
    steps:
      - name: Pré-condições (secrets e variáveis do Supabase)
        run: |
          missing=""
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF PORTAL_URL; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -z "$missing" ] || { echo "::error::Configuração ausente no Environment production:$missing (docs/SECURITY.md)"; exit 1; }
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fic/supabase test
      # CLI v3: "db push" sem --remote mira a stack local; mutações hospedadas exigem --yes;
      # "functions deploy" usa o projeto vinculado (não aceita --project-ref).
      - uses: supabase/setup-cli@v1
        with: { version: 3.1.0 }
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase db push --remote --dry-run
      - run: supabase db push --remote --yes
      - run: supabase functions deploy admin-invite --use-api --yes
