# Configuração do Supabase CLI. Em produção: `supabase link` + `supabase config push`.
project_id = "fulltime-intelligent-consig"

[api]
schemas = ["public"]
max_rows = 500

[auth]
site_url = "env(PORTAL_URL)"
additional_redirect_urls = ["env(PORTAL_URL)"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Cadastro aberto desligado: membros são criados por um admin (painel + SQL Editor). Sem e-mail.
enable_signup = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
# Provedor LIGADO: é o login com e-mail + senha. Nenhum e-mail é enviado pelo sistema:
# - cadastro aberto bloqueado por auth.enable_signup = false (não use auth.email.enable_signup: no CLI v3 ele
#   vira auth.email.enabled e desligaria o login de todos);
# - sem confirmação de cadastro nem de troca de e-mail;
# - secure_password_change = false: a troca de senha logada não pede código por e-mail.
enabled = true
enable_confirmations = false
double_confirm_changes = false
secure_password_change = false

[auth.mfa]
max_enrolled_factors = 3
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
sign_in_sign_ups = 30
token_refresh = 150

