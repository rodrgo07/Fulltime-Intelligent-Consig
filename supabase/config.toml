# Configuração do Supabase CLI. Em produção: `supabase link` + `supabase config push`.
project_id = "fulltime-intelligent-consig"

[api]
schemas = ["public"]
max_rows = 500

[auth]
site_url = "env(PORTAL_URL)"
additional_redirect_urls = ["env(PORTAL_URL)"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Cadastro aberto desligado: operadores entram somente por convite de um admin.
enable_signup = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
# Provedor de e-mail LIGADO (login com senha, convite e recuperação). O cadastro aberto é bloqueado só por
# auth.enable_signup = false. Não use auth.email.enable_signup: no CLI v3 ele vira auth.email.enabled e
# desligaria o login por e-mail de todos.
enabled = true
double_confirm_changes = true
enable_confirmations = true

[auth.email.template.invite]
subject = "Convite para o Fulltime Intelligent Consig"
content_path = "./supabase/templates/convite.html"

[auth.email.template.recovery]
subject = "Redefinição de senha — Fulltime Intelligent Consig"
content_path = "./supabase/templates/recuperacao.html"

[auth.mfa]
max_enrolled_factors = 3
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
sign_in_sign_ups = 30
token_refresh = 150

[functions.dispatch-notifications]
verify_jwt = false   # protegida por x-cron-secret (chamada pelo pg_cron)

[functions.admin-invite]
verify_jwt = true
